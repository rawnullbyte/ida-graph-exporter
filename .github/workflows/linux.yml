name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pinned to the SDK matching IDA 9.3. Deliberately not the newest SDK: 9.4
# renamed get_func_bitness() to get_func_bitness_ea(), so a plugin linked
# against 9.4 fails to load in IDA 9.3 with an unresolved symbol. IDA 9.4+
# still exports the old get_func_bitness symbol, so a 9.3-linked plugin loads
# on 9.3 and everything newer -- one artifact covering more versions.
env:
  IDA_SDK_REF: v9.3.0-sdk.3

jobs:
  build:
    name: Build Linux x86_64 plugin
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch IDA SDK
        uses: actions/checkout@v4
        with:
          repository: HexRaysSA/ida-sdk
          ref: ${{ env.IDA_SDK_REF }}
          path: ida-sdk
          # Depth 1: the SDK repository is large and no history is needed.
          fetch-depth: 1

      - name: Build plugin
        run: ./cpp/IdaGraph/build_linux.sh cpp/IdaGraph/build "${GITHUB_WORKSPACE}/ida-sdk"

      - name: Report artifact
        run: |
          file cpp/IdaGraph/build/IdaGraph.so
          echo "---"
          readelf -d cpp/IdaGraph/build/IdaGraph.so | grep -E 'NEEDED|RUNPATH' || true

      # A plugin built against a newer SDK than the target IDA can still link
      # cleanly but fail to load, because IDA resolves these symbols at load
      # time (e.g. get_func_bitness_ea in 9.4 vs get_func_bitness in 9.3).
      - name: Check IDA symbols resolve
        run: |
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/ida-sdk/src/lib/x64_linux_64" \
            ldd -r cpp/IdaGraph/build/IdaGraph.so > ldd.txt 2>&1 || true
          if grep -q 'undefined symbol' ldd.txt; then
            echo "::error::Plugin has unresolved IDA symbols:"
            grep 'undefined symbol' ldd.txt
            exit 1
          fi
          echo "All IDA symbols resolve."

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: IdaGraph-linux-x86_64
          path: cpp/IdaGraph/build/IdaGraph.so
          if-no-files-found: error
          retention-days: 30
